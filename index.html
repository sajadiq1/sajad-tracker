/* ============================================================
   8ب) عارض المستندات بملء الشاشة — رفع ملف محلي (PDF / صورة / نص)
   يُفتح فوق كل شيء (z-index أعلى)، مع مؤقّت مصغّر ثابت أعلى المنتصف
   يبقى محدَّثاً باستمرار أثناء القراءة. يستخدم createObjectURL ويحرّر
   الذاكرة (revokeObjectURL) دوماً عند الإغلاق أو تبديل الملف.
   ============================================================ */
let currentDocObjectUrl = null;
const taskDocInputEl = document.getElementById('taskDocInput');
const docFsOverlayEl = document.getElementById('docFsOverlay');
const docFsBodyEl = document.getElementById('docFsBody');
const docFsContentWrapEl = document.getElementById('docFsContentWrap');
const docFsFilenameEl = document.getElementById('docFsFilename');
const docFsLoadingEl = document.getElementById('docFsLoading');
const docAnnotCanvasEl = document.getElementById('docAnnotCanvas');

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

function revokeDocObjectUrl(){
  if(currentDocObjectUrl){
    URL.revokeObjectURL(currentDocObjectUrl);
    currentDocObjectUrl = null;
  }
}
function clearDocContentWrap(){
  docFsContentWrapEl.querySelectorAll('canvas.doc-page-canvas, img.doc-fs-image, pre.doc-fs-text').forEach(el=> el.remove());
}
function teardownDocFsOverlay(){
  docFsOverlayEl.classList.remove('open');
  revokeDocObjectUrl();
  clearDocContentWrap();
  docFsBodyEl.classList.remove('has-doc');
  docFsLoadingEl.classList.remove('show');
  docFsFilenameEl.textContent = '';
  if(taskDocInputEl) taskDocInputEl.value = '';
  resetDocAnnotCanvas();
  docAnnotMode = 'scroll';
  if(typeof applyDocAnnotMode === 'function') applyDocAnnotMode();
}
function closeDocFsOverlay(){
  teardownDocFsOverlay();
}

/* يعيد ضبط حجم لوحة التحشية الشفافة بحيث تغطي كامل ارتفاع/عرض
   محتوى المستند (وليس ارتفاع الشاشة فقط)، كي تبقى مواءمة تماماً
   مع المحتوى أثناء التمرير الحر داخل الحاوية القابلة للتمرير. */
function resizeDocAnnotCanvas(){
  const w = docFsContentWrapEl.scrollWidth || docFsBodyEl.clientWidth;
  const h = docFsContentWrapEl.scrollHeight || docFsBodyEl.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  const prevDrawingUrl = (docAnnotCanvasEl.width && docAnnotCanvasEl.height) ? docAnnotCanvasEl.toDataURL() : null;
  docAnnotCanvasEl.style.width = w + 'px';
  docAnnotCanvasEl.style.height = h + 'px';
  docAnnotCanvasEl.width = Math.max(1, w*dpr);
  docAnnotCanvasEl.height = Math.max(1, h*dpr);
  const ctx = docAnnotCanvasEl.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(prevDrawingUrl){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img, 0, 0, w, h);
    img.src = prevDrawingUrl;
  }
}
function resetDocAnnotCanvas(){
  docAnnotCanvasEl.width = 0; docAnnotCanvasEl.height = 0;
  docAnnotCanvasEl.style.width = '0'; docAnnotCanvasEl.style.height = '0';
}

async function renderPdfIntoWrap(objectUrl){
  const loadingTask = pdfjsLib.getDocument(objectUrl);
  const pdf = await loadingTask.promise;
  const containerWidth = Math.min(920, docFsBodyEl.clientWidth - 24);
  for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = containerWidth / baseViewport.width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.className = 'doc-page-canvas';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    docFsContentWrapEl.insertBefore(canvas, docAnnotCanvasEl);
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
  }
}
function renderImageIntoWrap(objectUrl){
  return new Promise((resolve)=>{
    const img = document.createElement('img');
    img.className = 'doc-fs-image';
    img.alt = 'document';
    img.onload = ()=> resolve();
    img.onerror = ()=> resolve();
    img.src = objectUrl;
    docFsContentWrapEl.insertBefore(img, docAnnotCanvasEl);
  });
}
function renderTextIntoWrap(file){
  return file.text().then(text=>{
    const pre = document.createElement('pre');
    pre.className = 'doc-fs-text';
    pre.textContent = text;
    docFsContentWrapEl.insertBefore(pre, docAnnotCanvasEl);
  });
}

async function loadTaskDocFile(file){
  if(!file) return;
  revokeDocObjectUrl();
  clearDocContentWrap();
  resetDocAnnotCanvas();
  docFsLoadingEl.classList.add('show');
  docFsOverlayEl.classList.add('open');
  currentDocObjectUrl = URL.createObjectURL(file);
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  try{
    if(isPdf && window.pdfjsLib){
      await renderPdfIntoWrap(currentDocObjectUrl);
    } else if(isImage){
      await renderImageIntoWrap(currentDocObjectUrl);
    } else {
      await renderTextIntoWrap(file);
    }
  }catch(e){
    await renderTextIntoWrap(file).catch(()=>{});
  }
  docFsBodyEl.classList.add('has-doc');
  docFsFilenameEl.textContent = file.name;
  docFsLoadingEl.classList.remove('show');
  requestAnimationFrame(resizeDocAnnotCanvas);
  updateDocFsTimer();
}
taskDocInputEl.addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(file) loadTaskDocFile(file);
});
document.getElementById('docFsCloseBtn').addEventListener('click', closeDocFsOverlay);
window.addEventListener('resize', ()=>{
  if(docFsOverlayEl.classList.contains('open')) resizeDocAnnotCanvas();
});

/* ---- الرسم على المستند: وضعا تمرير/رسم منفصلان + أداتا قلم وتظليل ----
   في وضع التمرير: تُعطَّل أحداث المؤشر على اللوحة (pointer-events:none)
   فتعمل لفتات التمرير الطبيعية بحرّية. في وضع الرسم: تُفعَّل اللوحة
   ويُمنع تمرير الخلفية أثناء السحب فعلياً عبر preventDefault(). */
let docAnnotMode = 'scroll'; // 'scroll' | 'draw'
let docAnnotTool = 'pen';    // 'pen' | 'highlighter' | 'eraser'
let docAnnotColor = '#263238', docAnnotBrushWidth = 3, docAnnotDrawing = false;
let docAnnotLastX = 0, docAnnotLastY = 0;

function applyDocAnnotMode(){
  docAnnotCanvasEl.classList.toggle('drawable', docAnnotMode === 'draw');
  document.getElementById('docModeScrollBtn').classList.toggle('active', docAnnotMode === 'scroll');
  document.getElementById('docModeDrawBtn').classList.toggle('active', docAnnotMode === 'draw');
}
function applyDocAnnotToolUI(){
  document.getElementById('docAnnotPenBtn').classList.toggle('active', docAnnotTool === 'pen');
  document.getElementById('docAnnotHighlightBtn').classList.toggle('active', docAnnotTool === 'highlighter');
  document.getElementById('docAnnotEraserBtn').classList.toggle('active', docAnnotTool === 'eraser');
}
document.getElementById('docModeScrollBtn').addEventListener('click', ()=>{ docAnnotMode = 'scroll'; applyDocAnnotMode(); });
document.getElementById('docModeDrawBtn').addEventListener('click', ()=>{ docAnnotMode = 'draw'; applyDocAnnotMode(); });

function docAnnotPos(e){
  const rect = docAnnotCanvasEl.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function docAnnotStroke(x1,y1,x2,y2){
  const ctx = docAnnotCanvasEl.getContext('2d');
  if(docAnnotTool === 'eraser'){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = Math.max(18, docAnnotBrushWidth*4);
  } else if(docAnnotTool === 'highlighter'){
    // تظليل شفاف يحافظ على وضوح النص الأصلي أسفله بفضل خلط multiply
    ctx.globalCompositeOperation = 'multiply';
    ctx.strokeStyle = 'rgba(255,255,0,0.4)';
    ctx.lineWidth = Math.max(14, docAnnotBrushWidth*3);
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = docAnnotColor;
    ctx.lineWidth = docAnnotBrushWidth;
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
docAnnotCanvasEl.addEventListener('pointerdown', (e)=>{
  if(docAnnotMode !== 'draw') return;
  e.preventDefault();
  docAnnotDrawing = true;
  const p = docAnnotPos(e); docAnnotLastX = p.x; docAnnotLastY = p.y;
  docAnnotStroke(p.x,p.y,p.x+0.01,p.y+0.01);
  try{ docAnnotCanvasEl.setPointerCapture(e.pointerId); }catch(err){}
});
docAnnotCanvasEl.addEventListener('pointermove', (e)=>{
  if(!docAnnotDrawing || docAnnotMode !== 'draw') return;
  e.preventDefault();
  const p = docAnnotPos(e);
  docAnnotStroke(docAnnotLastX, docAnnotLastY, p.x, p.y);
  docAnnotLastX = p.x; docAnnotLastY = p.y;
});
['pointerup','pointercancel','pointerleave'].forEach(ev=> docAnnotCanvasEl.addEventListener(ev, ()=> docAnnotDrawing=false));

document.querySelectorAll('#docAnnotToolbar .sketch-swatch').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    docAnnotColor = sw.dataset.color;
    docAnnotTool = 'pen';
    applyDocAnnotToolUI();
    document.querySelectorAll('#docAnnotToolbar .sketch-swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
  });
});
document.getElementById('docAnnotPenBtn').addEventListener('click', ()=>{ docAnnotTool = 'pen'; applyDocAnnotToolUI(); });
document.getElementById('docAnnotHighlightBtn').addEventListener('click', ()=>{ docAnnotTool = 'highlighter'; applyDocAnnotToolUI(); });
document.getElementById('docAnnotEraserBtn').addEventListener('click', ()=>{ docAnnotTool = 'eraser'; applyDocAnnotToolUI(); });
document.getElementById('docAnnotBrushSize').addEventListener('input', (e)=>{
  docAnnotBrushWidth = Number(e.target.value || 3);
});
document.getElementById('docAnnotClearBtn').addEventListener('click', ()=>{
  const ctx = docAnnotCanvasEl.getContext('2d');
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0,0,docAnnotCanvasEl.width, docAnnotCanvasEl.height);
  ctx.restore();
});
applyDocAnnotMode();
applyDocAnnotToolUI();

function updateDocFsTimer(){
  const topic = getTopic(currentProjectId, currentTaskViewTopicId);
  const elapsedEl = document.getElementById('docFsElapsed');
  if(!topic || !elapsedEl) return;
  const running = activeTimer && activeTimer.topicId === topic.id;
  let liveSeconds = topic.spentSeconds || 0;
  if(running) liveSeconds += Math.floor((Date.now() - activeTimer.startEpochMs)/1000);
  const allocSec = Number(topic.timeMinutes||0) * 60;
  const remaining = Math.max(0, allocSec - liveSeconds);
  const mm = String(Math.floor(remaining/60)).padStart(2,'0');
  const ss = String(remaining%60).padStart(2,'0');
  elapsedEl.textContent = `${mm}:${ss}`;
}

/* ------------------------------------------------------------
   الصوت الخلفي العام — مبني على YouTube IFrame API الحقيقية
   ------------------------------------------------------------ */
let ytApiPromise = null;
function loadYouTubeIframeAPI(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject)=>{
    const prevReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){
      if(typeof prevReady === 'function'){ try{ prevReady(); }catch(e){} }
      resolve();
    };
    if(!document.getElementById('yt-iframe-api-script')){
      const tag = document.createElement('script');
      tag.id = 'yt-iframe-api-script';
      tag.src = 'https://www.youtube.com/iframe_api';
      tag.onerror = ()=> reject(new Error('yt-api-load-failed'));
      document.head.appendChild(tag);
    }
    setTimeout(()=>{ if(!(window.YT && window.YT.Player)) reject(new Error('yt-api-timeout')); }, 12000);
  });
  return ytApiPromise;
}

let bgPlayer = null;
let bgPlayerReady = false;
let bgSeeking = false;
let bgProgressInterval = null;
let audioPlaylist = [];   // قائمة تشغيل بسيطة: كل عنصر معرّف فيديو يوتيوب
let audioPlaylistIndex = -1;

function updateAudioTrackNote(){

function setAudioPlayPauseIcon(isPlaying){

function destroyBgPlayer(){

function onBgPlayerStateChange(e){
  if(!window.YT) return;
  if(e.data === YT.PlayerState.PLAYING) setAudioPlayPauseIcon(true);
  else if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.CUED){
    setAudioPlayPauseIcon(false);
  } else if(e.data === YT.PlayerState.ENDED){
    if(audioPlaylist.length > 1) playAudioTrackAt(audioPlaylistIndex+1);
    else setAudioPlayPauseIcon(false);
  }
}

function startBgProgressPolling(){
  if(bgProgressInterval) clearInterval(bgProgressInterval);
  bgProgressInterval = setInterval(()=>{
    if(!bgPlayer || !bgPlayerReady || bgSeeking) return;
    if(typeof bgPlayer.getDuration !== 'function') return;
    const dur = bgPlayer.getDuration();
    const cur = bgPlayer.getCurrentTime();
    if(dur > 0){
      document.getElementById('audioProgressRange').value = (cur/dur)*100;
    }
  }, 500);
}

function createBgPlayer(videoId){
  const playPauseBtn = document.getElementById('globalAudioPlayPauseBtn');
  const progressRange = document.getElementById('audioProgressRange');
  playPauseBtn.style.display = 'inline-flex';
  playPauseBtn.disabled = true;

  loadYouTubeIframeAPI().then(()=>{
    bgPlayer = new YT.Player('globalAudioMount', {
      videoId: videoId,
      playerVars: { autoplay:1, loop: audioPlaylist.length <= 1 ? 1 : 0, playlist: audioPlaylist.length <= 1 ? videoId : undefined, controls:0 },
      events:{
        onReady: function(ev){
          bgPlayerReady = true;
          playPauseBtn.disabled = false;
          progressRange.disabled = false;
          document.getElementById('audioPrevBtn').disabled = audioPlaylist.length < 2;
          document.getElementById('audioNextBtn').disabled = audioPlaylist.length < 2;
          try{ ev.target.playVideo(); }catch(err){}
          setAudioPlayPauseIcon(true);
          startBgProgressPolling();
          updateAudioTrackNote();
        },
        onStateChange: onBgPlayerStateChange,
        onError: function(){
          alert(t('alertInvalidUrl'));
          destroyBgPlayer();
        }
      }
    });
    document.getElementById('audioToggleBtn').classList.add('active');
  }).catch(()=>{
    alert(t('alertInvalidUrl'));
    destroyBgPlayer();
  });
}

/* ينتقل إلى مقطع بعينه داخل قائمة التشغيل: يعيد استخدام مشغّل يوتيوب
   الحالي إن كان جاهزاً (loadVideoById) بدل إعادة إنشائه من الصفر. */
function playAudioTrackAt(index){
  if(audioPlaylist.length === 0) return;
  const wrapped = ((index % audioPlaylist.length) + audioPlaylist.length) % audioPlaylist.length;
  audioPlaylistIndex = wrapped;
  const videoId = audioPlaylist[wrapped];
  if(bgPlayer && bgPlayerReady && typeof bgPlayer.loadVideoById === 'function'){
    bgPlayer.loadVideoById(videoId);
    setAudioPlayPauseIcon(true);
    updateAudioTrackNote();
  } else {
    createBgPlayer(videoId);
  }
}

function handleAudioLoadClick(){
  const url = document.getElementById('audioUrlInput').value.trim();
  if(!url) return;
  const id = extractYouTubeId(url);
  if(!id){ alert(t('alertInvalidUrl')); return; }
  audioPlaylist.push(id);
  document.getElementById('audioUrlInput').value = '';
  if(audioPlaylistIndex === -1 || !bgPlayer){
    playAudioTrackAt(audioPlaylist.length-1);
  } else {
    document.getElementById('audioPrevBtn').disabled = audioPlaylist.length < 2;
    document.getElementById('audioNextBtn').disabled = audioPlaylist.length < 2;
    updateAudioTrackNote();
  }
}

function toggleBgPlayPause(){
  if(!bgPlayer || !bgPlayerReady || typeof bgPlayer.getPlayerState !== 'function') return;
  const state = bgPlayer.getPlayerState();
  if(state === YT.PlayerState.PLAYING){
    bgPlayer.pauseVideo();
    setAudioPlayPauseIcon(false);
  } else {
    bgPlayer.playVideo();
    setAudioPlayPauseIcon(true);
  }
}

document.getElementById('globalAudioLoadBtn').addEventListener('click', handleAudioLoadClick);
document.getElementById('audioUrlInput').addEventListener('keydown', (e)=>{

/* ============================================================
   8ج) الآلة الحاسبة العلمية العائمة القابلة للسحب
   ============================================================ */
(function calculatorWidget(){
  const widget = document.getElementById('calcWidget');
  const header = document.getElementById('calcHeader');
  const exprEl = document.getElementById('calcExpr');
  const resultEl = document.getElementById('calcResult');
  const grid = document.getElementById('calcGrid');
  const toggleBtn = document.getElementById('calcToggleBtn');
  const closeBtn = document.getElementById('calcCloseBtn');

  let expr = '';
  let shiftOn = false;
  const shiftBtn = document.getElementById('calcShiftBtn');
  const sciBtns = Array.from(document.querySelectorAll('.calc-sci-btn'));

  /* يحسب عدد الأقواس المفتوحة غير المُغلقة في التعبير، ويعيد نصاً
     جاهزاً للتقييم بعد إضافة كل الأقواس الناقصة تلقائياً، دون تعديل
     ما يظهر للمستخدم في شريط التعبير نفسه. */
  function withAutoClosedParens(str){
    let openCount = 0;
    for(const ch of str){
      if(ch === '(') openCount++;
      else if(ch === ')') openCount = Math.max(0, openCount-1);
    }
    return openCount > 0 ? str + ')'.repeat(openCount) : str;
  }

  function render(){
    exprEl.textContent = expr || '\u00A0';
    if(!expr){ resultEl.textContent = '0'; return; }
    try{
      const val = math.evaluate(withAutoClosedParens(expr));
      resultEl.textContent = (typeof val === 'number') ? math.format(val, {precision:10}) : String(val);
    }catch(e){
      resultEl.textContent = expr.length ? '…' : '0';
    }
  }

  function computeFinal(){
    if(!expr) return;
    const completedExpr = withAutoClosedParens(expr);
    try{
      const val = math.evaluate(completedExpr);
      const formatted = (typeof val === 'number') ? math.format(val, {precision:10}) : String(val);
      exprEl.textContent = completedExpr + ' =';
      resultEl.textContent = formatted;
      expr = formatted;
    }catch(e){
      resultEl.textContent = 'Error';
    }
  }

  function applyShiftLabels(){
    shiftBtn.classList.toggle('shift-on', shiftOn);
    sciBtns.forEach(btn=>{
      btn.textContent = shiftOn ? btn.dataset.shiftLabel : btn.dataset.label;
      btn.classList.toggle('shift-on', shiftOn);
    });
  }

  grid.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    const act = btn.dataset.act;
    if(act === 'shift'){ shiftOn = !shiftOn; applyShiftLabels(); return; }
    if(act === 'clear'){ expr=''; render(); return; }
    if(act === 'back'){ expr = expr.slice(0,-1); render(); return; }
    if(act === 'eq'){ computeFinal(); if(shiftOn){ shiftOn=false; applyShiftLabels(); } return; }
    const isSci = btn.classList.contains('calc-sci-btn');
    const k = isSci ? (shiftOn ? btn.dataset.shiftK : btn.dataset.k) : btn.dataset.k;
    if(k === undefined) return;
    expr += k;
    if(isSci && shiftOn){ shiftOn = false; applyShiftLabels(); }
    render();
  });

  function openCalc(){ widget.classList.add('open'); }
  function closeCalc(){ widget.classList.remove('open'); }
  toggleBtn.addEventListener('click', ()=>{
    closeSettingsPanel();
    if(widget.classList.contains('open')) closeCalc(); else openCalc();
  });
  closeBtn.addEventListener('click', closeCalc);

  // سحب حر للحاسبة عبر شريط العنوان
  let dragging=false, offX=0, offY=0;
  header.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('button')) return;
    dragging = true;
    const rect = widget.getBoundingClientRect();
    offX = e.clientX - rect.left; offY = e.clientY - rect.top;
    widget.style.right = 'auto';
    widget.style.left = rect.left + 'px';
    widget.style.top = rect.top + 'px';
    try{ header.setPointerCapture(e.pointerId); }catch(err){}
  });
  header.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const maxX = window.innerWidth - widget.offsetWidth - 4;
    const maxY = window.innerHeight - 40;
    widget.style.left = Math.max(4, Math.min(maxX, e.clientX - offX)) + 'px';
    widget.style.top = Math.max(4, Math.min(maxY, e.clientY - offY)) + 'px';
  });
  ['pointerup','pointercancel'].forEach(ev=> header.addEventListener(ev, ()=> dragging=false));

  render();
})();

/* اللوحة قابلة للتمرير الرأسي بلا حدود عملية: تبدأ بارتفاع يعادل ثلاثة
   أضعاف الشاشة، وتنمو تلقائياً كلما اقترب المستخدم من أسفلها أثناء
   التمرير، حتى سقف معقول يكفي لأي جلسة عمل طويلة. */
function setupSketchCanvas(){
  applySketchBgLayer();
  sketchContentHeight = window.innerHeight * 3;
  applySketchContentHeight(false);
}
function applySketchContentHeight(preserveDrawing){
  const wrap = document.getElementById('sketchCanvasWrap');
  const content = document.getElementById('sketchContent');
  const canvas = document.getElementById('sketchCanvas');
  const width = wrap.clientWidth;
  content.style.height = sketchContentHeight + 'px';
  const dpr = window.devicePixelRatio || 1;
  const prevData = (preserveDrawing && canvas.width && canvas.height) ? canvas.toDataURL() : null;
  canvas.style.width = width + 'px';
  canvas.style.height = sketchContentHeight + 'px';
  canvas.width = Math.max(1, width*dpr);
  canvas.height = Math.max(1, sketchContentHeight*dpr);
  sketchCtx = canvas.getContext('2d');
  sketchCtx.setTransform(dpr,0,0,dpr,0,0);
  if(prevData){
    const img = new Image();
    img.onload = ()=> sketchCtx.drawImage(img, 0, 0, width, sketchContentHeight);
    img.src = prevData;
  }
}
function growSketchIfNeeded(){
  const wrap = document.getElementById('sketchCanvasWrap');
  if(sketchContentHeight >= SKETCH_MAX_HEIGHT) return;
  if(wrap.scrollTop + wrap.clientHeight > sketchContentHeight - 400){
    sketchContentHeight = Math.min(SKETCH_MAX_HEIGHT, sketchContentHeight + window.innerHeight);
    applySketchContentHeight(true);
  }
}
document.getElementById('sketchCanvasWrap').addEventListener('scroll', growSketchIfNeeded);

function clearSketchCanvas(){
  if(!sketchCtx) return;
  const canvas = document.getElementById('sketchCanvas');
  sketchCtx.save();
  sketchCtx.globalCompositeOperation = 'source-over';
  sketchCtx.clearRect(0,0,canvas.clientWidth, canvas.clientHeight);
  sketchCtx.restore();
}
function updateSketchTimer(){
  const topic = getTopic(currentProjectId, currentTaskViewTopicId);
  if(!topic){ return; }
  const running = activeTimer && activeTimer.topicId === topic.id;
  let liveSeconds = topic.spentSeconds || 0;
  if(running) liveSeconds += Math.floor((Date.now() - activeTimer.startEpochMs)/1000);
  const allocSec = Number(topic.timeMinutes||0) * 60;
  const remaining = Math.max(0, allocSec - liveSeconds);
  const mm = String(Math.floor(remaining/60)).padStart(2,'0');
  const ss = String(remaining%60).padStart(2,'0');
  document.getElementById('sketchTimerVal').textContent = `${mm}:${ss}`;
}

function sketchPos(e){
  const canvas = document.getElementById('sketchCanvas');
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function sketchStroke(x1,y1,x2,y2){
  if(sketchTool === 'eraser'){
    sketchCtx.globalCompositeOperation = 'destination-out';
    sketchCtx.strokeStyle = 'rgba(0,0,0,1)';
    sketchCtx.lineWidth = Math.max(18, sketchBrushWidth*4);
  } else if(sketchTool === 'highlighter'){
    sketchCtx.globalCompositeOperation = 'multiply';
    sketchCtx.strokeStyle = 'rgba(255,255,0,0.4)';
    sketchCtx.lineWidth = Math.max(14, sketchBrushWidth*3);
  } else {
    sketchCtx.globalCompositeOperation = 'source-over';
    sketchCtx.strokeStyle = sketchColor;
    sketchCtx.lineWidth = sketchBrushWidth;
  }
  sketchCtx.lineCap = 'round'; sketchCtx.lineJoin = 'round';
  sketchCtx.beginPath(); sketchCtx.moveTo(x1,y1); sketchCtx.lineTo(x2,y2); sketchCtx.stroke();
}

   فعلياً أثناء السحب عبر preventDefault(). */
function applySketchModeUI(){

(function bindSketchPointerEvents(){
  const canvas = document.getElementById('sketchCanvas');
  canvas.addEventListener('pointerdown', (e)=>{
    if(sketchMode !== 'draw') return;
    e.preventDefault();
    sketchDrawing = true;
    const p = sketchPos(e); sketchLastX = p.x; sketchLastY = p.y;
    sketchStroke(p.x,p.y,p.x+0.01,p.y+0.01);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(!sketchDrawing || sketchMode !== 'draw') return;
    e.preventDefault();
    const p = sketchPos(e);
    sketchStroke(sketchLastX, sketchLastY, p.x, p.y);
    sketchLastX = p.x; sketchLastY = p.y;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=> canvas.addEventListener(ev, ()=> sketchDrawing=false));
})();

/* تصدير اللوحة إلى PDF: يلتقط طبقة الرسم كاملة (بارتفاعها الفعلي
   الممتد للأسفل) ويوزّعها على عدّة صفحات A4 عند الحاجة. */
function exportSketchToPdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){ alert(t('exportPdfUnavailable')); return; }
  const canvas = document.getElementById('sketchCanvas');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  // تركيب خلفية بيضاء أسفل الرسم الشفاف قبل التصدير (التصدير لا يعيد رسم خطوط الكراسة)
  const composed = document.createElement('canvas');
  composed.width = canvas.width; composed.height = canvas.height;
  const cctx = composed.getContext('2d');
  cctx.fillStyle = '#ffffff';
  cctx.fillRect(0,0,composed.width, composed.height);
  cctx.drawImage(canvas, 0, 0);

  const imgData = composed.toDataURL('image/png');
  const imgProps = pdf.getImageProperties(imgData);
  const pdfImgWidth = pageWidth;
  const pdfImgHeight = (imgProps.height * pdfImgWidth) / imgProps.width;
  let heightLeft = pdfImgHeight;
  let position = 0;
  pdf.addImage(imgData, 'PNG', 0, position, pdfImgWidth, pdfImgHeight);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position = heightLeft - pdfImgHeight;
    pdf.addPage();
    pdf.addImage(imgData, 'PNG', 0, position, pdfImgWidth, pdfImgHeight);
    heightLeft -= pageHeight;
  }
  pdf.save('sketch.pdf');
}
document.getElementById('sketchExportPdfBtn').addEventListener('click', exportSketchToPdf);

   ============================================================ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   13) الوضع الداكن/الفاتح ولون الواجهة وحجم الخط ونوع الخط
   ============================================================ */
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function rgbStringToHex(str){
  const m = String(str||'').match(/\d+/g);
  if(!m || m.length<3) return null;
  return rgbToHex(Number(m[0]), Number(m[1]), Number(m[2]));
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
  document.getElementById('themeToggle').title = theme === 'dark' ? t('themeLight') : t('themeDark');
  localStorage.setItem(THEME_KEY, theme);
  const savedColor = localStorage.getItem(COLOR_KEY);
  if(savedColor){
    applyAccentColor(savedColor);
  } else {
    const computed = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const hex = rgbStringToHex(computed) || (computed.startsWith('#') ? computed : null);
    if(hex) document.getElementById('colorPicker').value = hex;
  }
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function shadeColor(hex, percent){
  const {r,g,b} = hexToRgb(hex);
  if(percent>=0){
    return rgbToHex(r+(255-r)*(percent/100), g+(255-g)*(percent/100), b+(255-b)*(percent/100));
  }
  const p = -percent/100;
  return rgbToHex(r*(1-p), g*(1-p), b*(1-p));
}
function applyAccentColor(hex){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-strong', shadeColor(hex, isDark ? 22 : -18));
  document.documentElement.style.setProperty('--accent-soft', shadeColor(hex, isDark ? -55 : 72));
  document.getElementById('colorPicker').value = hex;
  localStorage.setItem(COLOR_KEY, hex);
}
document.getElementById('colorPicker').addEventListener('input', (e)=> applyAccentColor(e.target.value));
document.getElementById('colorPicker').addEventListener('change', (e)=> applyAccentColor(e.target.value));

/* ============================================================
   خلفية مخصّصة من معرض الصور — تُحفظ Base64 في التخزين المحلي
   وتُطبَّق كخلفية عامة للتطبيق، فوق التدرجات واللمسات الافتراضية.
   ============================================================ */
function applyCustomBackground(dataUrl){
  if(dataUrl){
    document.body.style.backgroundImage = `url(${dataUrl})`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
    document.body.style.backgroundRepeat = 'no-repeat';
  } else {
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundAttachment = '';
    document.body.style.backgroundRepeat = '';
  }
}
function handleBgUpload(file){
  if(!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const dataUrl = reader.result;
    try{
      localStorage.setItem(BG_IMAGE_KEY, dataUrl);
      applyCustomBackground(dataUrl);
    }catch(e){
      alert(t('bgTooLarge'));
    }
  };
  reader.readAsDataURL(file);
}
function clearCustomBackground(){
  localStorage.removeItem(BG_IMAGE_KEY);
  applyCustomBackground(null);
}
document.getElementById('bgUploadInput').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(file) handleBgUpload(file);
});
document.getElementById('bgClearBtn').addEventListener('click', clearCustomBackground);

function applyFontScale(val){
  document.documentElement.style.setProperty('--text-scale', val);
  localStorage.setItem(FONT_KEY, val);
}
document.getElementById('fontScaleSlider').addEventListener('input', (e)=> applyFontScale(e.target.value));

const FONT_FAMILY_MAP = {
  sans: "'Tajawal','Segoe UI',sans-serif",
  serif: "'Markazi Text','Amiri',serif",
  mono: "'JetBrains Mono','Consolas',monospace"
};
function applyFontFamily(key){
  if(!FONT_FAMILY_MAP[key]) key = 'sans';
  document.documentElement.style.setProperty('--base-font-family', FONT_FAMILY_MAP[key]);
  localStorage.setItem(FONT_FAMILY_KEY, key);
  document.getElementById('fontFamilySelect').value = key;
}
document.getElementById('fontFamilySelect').addEventListener('change', (e)=> applyFontFamily(e.target.value));

/* ============================================================
   14) نظام تعدد اللغات (i18n)
   ============================================================ */
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = t(el.dataset.i18nTitle); });
}
const RTL_LANGS = ['ar', 'ku'];
function setLanguage(lang){
  if(!I18N[lang]) lang = 'en';
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';
  document.getElementById('langSelect').value = lang;

  applyStaticI18n();
  applyTheme(document.documentElement.getAttribute('data-theme'));
  renderDashboard();
  if(currentProjectId) renderProjectDetail();
  if(currentTaskViewTopicId) renderTaskView();
}
document.getElementById('langSelect').addEventListener('change', (e)=> setLanguage(e.target.value));

/* ============================================================
   15) القائمة الأفقية للإعدادات
   ============================================================ */
const settingsBtnEl = document.getElementById('settingsBtn');
const settingsPanelEl = document.getElementById('settingsPanel');

function openSettingsPanel(){
  settingsPanelEl.classList.add('open');
  settingsBtnEl.setAttribute('aria-expanded','true');
}
function closeSettingsPanel(){
  settingsPanelEl.classList.remove('open');
  settingsBtnEl.setAttribute('aria-expanded','false');
}
function toggleSettingsPanel(){
  if(settingsPanelEl.classList.contains('open')) closeSettingsPanel();
  else openSettingsPanel();
}

settingsBtnEl.addEventListener('click', (e)=>{
  e.stopPropagation();
  toggleSettingsPanel();
});
settingsPanelEl.addEventListener('click', (e)=> e.stopPropagation());
document.addEventListener('click', (e)=>{
  if(settingsPanelEl.classList.contains('open') && !e.target.closest('.settings-wrap')){
    closeSettingsPanel();
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && settingsPanelEl.classList.contains('open')) closeSettingsPanel();
});

/* ============================================================
   16) ربط الأحداث العامة وبدء التشغيل
   ============================================================ */
document.getElementById('backBtn').addEventListener('click', closeProject);
document.getElementById('addTopicBtn').addEventListener('click', addTopic);
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('topicWeight').addEventListener('input', ()=>{
  const project = getProject(currentProjectId);
  if(project) syncAddButtonState(project);
});
document.getElementById('deleteProjectBtn').addEventListener('click', ()=>{
  const project = getProject(currentProjectId);
  if(!project) return;
  if(confirm(t('confirmDeleteProject',{name:project.name}))){
    if(activeTimer) pauseTimer();
    state.projects = state.projects.filter(p=>p.id!==project.id);
    resequenceIndexes();
    saveState();
    closeProject();
  }
});

(function init(){
  loadState();
  importFromUrlIfPresent();

  const savedLang = localStorage.getItem(LANG_KEY) || 'ar';
  currentLang = I18N[savedLang] ? savedLang : 'ar';
  document.documentElement.lang = currentLang;
  document.documentElement.dir = RTL_LANGS.includes(currentLang) ? 'rtl' : 'ltr';
  document.getElementById('langSelect').value = currentLang;

  const savedScale = localStorage.getItem(FONT_KEY) || '1';
  document.getElementById('fontScaleSlider').value = savedScale;
  applyFontScale(savedScale);

  const savedFontFamily = localStorage.getItem(FONT_FAMILY_KEY) || 'sans';
  applyFontFamily(savedFontFamily);

  try{
    const savedBg = localStorage.getItem(BG_IMAGE_KEY);
    if(savedBg) applyCustomBackground(savedBg);
  }catch(e){ /* تجاهل أي عطل في قراءة الخلفية المخصّصة */ }

  bindInlineProjectNameEdit();
  bindInlineTaskNameEdit();

  applyStaticI18n();
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');
  showScreen('dashboard');
  renderDashboard();
})();
</script>
